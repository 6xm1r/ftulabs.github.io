name: K65 Members

on:
  pull_request:
    paths: ["k65/members/**"]
  push:
    branches: [main]
    paths: ["k65/members/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate member files
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_k65.py --check

      - name: Rebuild k65/members.json
        if: github.event_name == 'push'
        run: |
          python3 scripts/build_k65.py
          git diff --quiet && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k65/members.json
          git commit -m "k65: Rebuild member list"
          git pull --rebase origin main
          git push
